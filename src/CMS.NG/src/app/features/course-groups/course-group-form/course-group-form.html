<form [formGroup]="form" (ngSubmit)="save()">
  <div class="page-header">
    <div class="start">
      <h1 class="title">{{ isEdit() ? '編輯課程群組' : '新增課程群組' }}</h1>
      @if (isEdit()) {
        <app-row-audit-badge tableName="CourseGroup" [pkid]="id()!" />
      }
    </div>
    <div class="actions">
      <p-button label="取消" icon="pi pi-times" severity="secondary" (onClick)="cancel()" />
      <p-button type="submit" label="儲存" icon="pi pi-check" [loading]="saving()" />
    </div>
  </div>

  <section class="page-card">
    <h2>課程群組資料</h2>

    @if (isEdit()) {
      <div class="field">
        <label>主代碼</label>
        <div class="view-value">{{ id() }}</div>
      </div>
    }

    <div class="field">
      <label for="description" class="required">群組名稱</label>
      <input pInputText id="description" formControlName="description" />
      @if (showError('description')) {
        <small class="error">{{ errorText('description', '群組名稱', 100) }}</small>
      }
    </div>
  </section>
</form>
