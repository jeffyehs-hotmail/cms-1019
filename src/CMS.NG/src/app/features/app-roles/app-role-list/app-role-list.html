<div class="page-header">
  <h1 class="title">角色 AppRole <span class="subtitle">使用者角色</span></h1>
  <div class="actions">
    <p-button
      label="搜尋條件"
      icon="pi pi-filter"
      severity="secondary"
      (onClick)="openFilters()"
      [badge]="activeFilterCount() ? '' + activeFilterCount() : undefined"
    />
    <p-button label="新增" icon="pi pi-plus" (onClick)="add()" />
  </div>
</div>

<div class="table-card">
  <p-table
    [value]="roles()"
    [loading]="loading()"
    dataKey="pkid"
    [paginator]="true"
    paginatorPosition="top"
    [rows]="page.rows"
    [first]="page.first"
    (firstChange)="onFirstChange($event)"
    (rowsChange)="onRowsChange($event)"
    [rowsPerPageOptions]="[10, 20, 50, 100]"
    [showCurrentPageReport]="true"
    currentPageReportTemplate="{first}–{last} 筆，共 {totalRecords} 筆"
    [sortField]="sort.field"
    [sortOrder]="sort.order"
    (onSort)="onSort($event)"
    [showGridlines]="true"
  >
    <ng-template #header>
      <tr>
        <th pSortableColumn="pkid" class="col-pkid">主代碼 <p-sortIcon field="pkid" /></th>
        <th pSortableColumn="roleId">角色代碼 <p-sortIcon field="roleId" /></th>
        <th pSortableColumn="roleName">角色名稱 <p-sortIcon field="roleName" /></th>
        <th pSortableColumn="permissionLevel" class="text-center">權限等級 <p-sortIcon field="permissionLevel" /></th>
        <th pSortableColumn="description">描述 <p-sortIcon field="description" /></th>
        <th pSortableColumn="userCount" class="text-center">使用者數 <p-sortIcon field="userCount" /></th>
        <th class="text-center col-actions">操作</th>
      </tr>
    </ng-template>

    <ng-template #body let-role>
      <tr>
        <td>{{ role.pkid }}</td>
        <td>{{ role.roleId }}</td>
        <td>{{ role.roleName }}</td>
        <td class="text-center">{{ role.permissionLevel }}</td>
        <td>{{ role.description }}</td>
        <td class="text-center">{{ role.userCount }}</td>
        <td class="text-center col-actions">
          <p-button
            icon="pi pi-eye"
            [text]="true"
            [rounded]="true"
            severity="secondary"
            pTooltip="檢視"
            [routerLink]="['/app-roles', role.pkid]"
            ariaLabel="檢視"
          />
          <p-button
            icon="pi pi-pencil"
            [text]="true"
            [rounded]="true"
            severity="info"
            pTooltip="編輯"
            [routerLink]="['/app-roles', role.pkid, 'edit']"
            ariaLabel="編輯"
          />
          <p-button
            icon="pi pi-trash"
            [text]="true"
            [rounded]="true"
            severity="danger"
            pTooltip="刪除"
            (onClick)="confirmDelete(role)"
            ariaLabel="刪除"
          />
        </td>
      </tr>
    </ng-template>

    <ng-template #emptymessage>
      <tr>
        <td colspan="7" class="text-center muted">查無資料</td>
      </tr>
    </ng-template>
  </p-table>
</div>

<p-drawer [(visible)]="drawerVisible" header="搜尋條件" position="right" styleClass="filter-drawer">
  <div class="field">
    <label for="f-keyword">關鍵字</label>
    <input
      pInputText
      id="f-keyword"
      [(ngModel)]="draft.keyword"
      placeholder="角色代碼 / 角色名稱 / 描述"
      (keydown.enter)="applyFilters()"
    />
  </div>
  <div class="field">
    <label for="f-level-from">權限等級</label>
    <div class="range">
      <p-inputNumber inputId="f-level-from" [(ngModel)]="draft.permissionLevelFrom" placeholder="從" [useGrouping]="false" />
      <span>~</span>
      <p-inputNumber inputId="f-level-to" [(ngModel)]="draft.permissionLevelTo" placeholder="到" [useGrouping]="false" />
    </div>
  </div>

  <ng-template #footer>
    <div class="drawer-actions">
      <p-button label="清除" icon="pi pi-times" severity="secondary" (onClick)="clearFilters()" />
      <p-button label="搜尋" icon="pi pi-search" (onClick)="applyFilters()" />
    </div>
  </ng-template>
</p-drawer>
