<div class="login-page">
  <form class="page-card login-card" [formGroup]="form" (ngSubmit)="submit()">
    <h1 class="title">CMS 登入</h1>

    <div class="field">
      <label for="userId" class="required">帳號</label>
      <input pInputText id="userId" formControlName="userId" autocomplete="username" />
      @if (showError('userId')) {
        <small class="error">請輸入帳號</small>
      }
    </div>

    <div class="field">
      <label for="password" class="required">密碼</label>
      <input pInputText id="password" type="password" formControlName="password" autocomplete="current-password" />
      @if (showError('password')) {
        <small class="error">請輸入密碼</small>
      }
    </div>

    <p-button type="submit" label="登入" icon="pi pi-sign-in" [loading]="loading()" styleClass="login-submit" />
  </form>
</div>
